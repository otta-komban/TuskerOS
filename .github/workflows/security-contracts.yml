name: Security contract validation

on:
  push:
    branches: ["06-security-gatekeeper"]
    paths:
      - "security/**"
      - ".github/workflows/security-contracts.yml"
  pull_request:
    paths:
      - "security/**"
      - ".github/workflows/security-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-security-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated security test dependencies
        run: python -m pip install -r security/requirements-test.txt
      - name: Validate schemas and audit-event contract
        run: python -m pytest -q security/tests

name: Theme pack validation

on:
  push:
    branches: [03-theme-studio]
    paths:
      - "theme-studio/**"
      - "themes/**"
      - ".github/workflows/theme-pack-validation.yml"
  pull_request:
    paths:
      - "theme-studio/**"
      - "themes/**"
      - ".github/workflows/theme-pack-validation.yml"

permissions:
  contents: read

jobs:
  validate-theme-packs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r theme-studio/requirements-dev.txt
      - name: Validate schema and starter packs
        run: python -m unittest discover -s theme-studio/tests -v

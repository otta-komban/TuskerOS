name: PHOENIX release manifest integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-manifest-integrity:
    name: Release manifest integrity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-release.txt
      - run: python -m py_compile scripts/verify_release_manifest.py scripts/validate_release_report.py tests/test_verify_release_manifest.py tests/test_validate_release_report.py
      - run: python -m unittest discover -s tests -p 'test_verify_release_manifest.py' -v
      - run: python -m unittest discover -s tests -p 'test_validate_release_report.py' -v

name: Tusker AI Runtime Unit Tests

on:
  push:
    branches: [agent/05-ai-runtime]
    paths:
      - 'tusker-ai/**'
      - '.github/workflows/tusker-ai-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tusker-ai/**'
      - '.github/workflows/tusker-ai-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated schema-test dependencies
        working-directory: tusker-ai
        run: python -m pip install -r requirements-test.txt
      - name: Run schema, fixture and runtime tests
        working-directory: tusker-ai
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Compile runtime and smoke harness
        working-directory: tusker-ai
        run: python -m compileall -q tusker_ai scripts tests

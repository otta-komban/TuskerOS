name: Desktop validation

on:
  push:
    branches:
      - agent/02-desktop-shell
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-static-validation:
    name: Desktop static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1

      - name: Install Qt Quick runtime for headless UI smoke test
        run: python -m pip install --disable-pip-version-check "PySide6>=6.8,<7"

      - name: Compile desktop Python modules
        run: python -m compileall -q desktop

      - name: Run desktop unit and Qt runtime tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest discover -s desktop/tests -v

      - name: Validate Plasma applet package
        run: python desktop/tools/validate_plasmoid.py desktop/plasmoid/package

      - name: Validate native dock template
        run: python desktop/tools/validate_panel_template.py desktop/panel-template

      - name: Check dock-template JavaScript syntax
        run: node --check desktop/panel-template/contents/layout.js
